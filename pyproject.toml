[project]
name = "zenodo-viewer"
version = "0.1.0"
description = "Zenodo Version Tracker - compare and browse Zenodo record versions"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "setuptools<70",
    "streamlit>=1.58.0",
    "streamlit-diff-viewer>=0.0.2",
    "streamlit-vis-timeline>=0.3.0",
]

[project.scripts]
zenodo_viewer = "zenodo_viewer:main"
zw = "zenodo_viewer:main"
